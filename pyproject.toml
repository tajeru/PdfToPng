[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdftopng"
version = "0.1.0"
description = "PDF をページごとに PNG へ分解し、向きを直して保存する GUI アプリ"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.2",
    "pypdfium2>=4.25,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pypdf>=4.0", "pyinstaller>=6.3"]

[project.gui-scripts]
pdftopng = "pdftopng.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
